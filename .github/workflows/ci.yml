name: CartFlow Microservices CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-backend:
    name: Build & Test Backend Microservices
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [product-service, order-service, payment-service, notification-service, api-gateway]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Run Unit Tests (${{ matrix.service }})
        run: |
          cd ${{ matrix.service }}
          mvn clean test -Dspring.profiles.active=test

  build-frontend:
    name: Build & Lint React Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-json.lock

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm ci || npm install
          npm run build
